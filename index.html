<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Compass | Dashboard Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Facebook SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
    <!-- Tesseract.js for OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        /* FIX SIMÉTRICO TIKTOK v10.8 - SYNC MODE */
        .neon-tiktok-label { color: #25f4ee !important; font-weight: 700 !important; font-size: 0.7rem !important; text-transform: uppercase !important; }
        .neon-tiktok-border { border: 1px solid rgba(37, 244, 238, 0.3) !important; }
        .neon-tiktok-input { background: rgba(15, 23, 42, 0.6) !important; color: #25f4ee !important; border: 1px solid rgba(37, 244, 238, 0.2) !important; font-size: 0.875rem !important; }
        .neon-tiktok-icon { color: #25f4ee !important; font-size: 1.2rem !important; }
        .version-badge-neon {
            background: #25f4ee !important;
            color: #000 !important;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 900;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <ion-icon name="compass-outline"></ion-icon>
            Execution Compass
        </div>
        <nav>
            <a href="#" class="nav-item active" onclick="showSection('dashboard')">
                <ion-icon name="grid-outline"></ion-icon> Dashboard
            </a>
            <a href="#" class="nav-item" onclick="showSection('marketing')">
                <ion-icon name="megaphone-outline"></ion-icon> Marketing
            </a>
            <a href="#" class="nav-item" onclick="showSection('operaciones')">
                <ion-icon name="briefcase-outline"></ion-icon> Operaciones
            </a>
            <a href="#" class="nav-item" onclick="showSection('ventas')">
                <ion-icon name="cash-outline"></ion-icon> Ventas y Finanzas
            </a>
            <a href="#" class="nav-item" onclick="showSection('saas')">
                <ion-icon name="rocket-outline"></ion-icon> SaaS
            </a>
            <a href="#" class="nav-item" onclick="showSection('config')">
                <ion-icon name="settings-outline"></ion-icon> Conexiones
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-title">
                <h1 id="view-title">Dashboard Ejecutivo</h1>
                <p id="view-subtitle">Resumen mensual de rendimiento • Enero 2026</p>
            </div>
            <div class="header-actions">
                <nav class="top-nav">
                    <button class="top-nav-item active" onclick="showSection('dashboard')">
                        <ion-icon name="grid-outline"></ion-icon> Dashboard
                    </button>
                    <button class="top-nav-item" onclick="showSection('marketing')">
                        <ion-icon name="megaphone-outline"></ion-icon> Marketing
                    </button>
                    <button class="top-nav-item" onclick="showSection('operaciones')">
                        <ion-icon name="briefcase-outline"></ion-icon> Operaciones
                    </button>
                    <button class="top-nav-item" onclick="showSection('ventas')">
                        <ion-icon name="cash-outline"></ion-icon> Finanzas
                    </button>
                    <button class="top-nav-item" onclick="showSection('saas')">
                        <ion-icon name="rocket-outline"></ion-icon> SaaS
                    </button>
                    <button class="top-nav-item" onclick="showSection('config')">
                        <ion-icon name="settings-outline"></ion-icon> Conexiones
                    </button>
                </nav>
                <div id="context-selector-target"></div>
            </div>
        </header>

        <div id="content-area">
            <!-- Dynamic Content Loaded by JS -->
            <div class="loading-state" style="padding: 2rem; color: var(--text-muted);">
                Cargando datos del dashboard...
            </div>
        </div>
    </main>

    <script src="main.v10.8.js"></script>
</body>

</html>
